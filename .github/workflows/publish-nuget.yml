name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  DOTNET_VERSION: "9.0.x"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"
  PACKAGE_PROJECT: "Maui.FormBuilder/Maui.FormBuilder.csproj"

jobs:
  build-pack-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore
        run: dotnet restore ${{ env.PACKAGE_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PACKAGE_PROJECT }} --configuration Release --framework net9.0 --no-restore

      - name: Pack
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} --configuration Release --framework net9.0 --no-build -o ./artifacts

      - name: Publish
        shell: pwsh
        run: |
          $packages = Get-ChildItem "./artifacts/*.nupkg" -File
          if (-not $packages) {
            Write-Error "No NuGet package files were found in ./artifacts."
            exit 1
          }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName `
              --api-key "${{ secrets.NUGET_API_KEY }}" `
              --source "${{ env.NUGET_SOURCE }}" `
              --skip-duplicate
          }
